<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --mist: #f3f8f8;
  --line: #d9e9ea;
  --line-strong: #a9d3d6;
  --blue: #a9d3d6;
  --blue-deep: #5f9ba0;
  --blue-ink: #3b7a80;
  --ink: #2f4a4d;
  --muted: #6d8688;
  --pink: #f3a6b4;
  --pink-deep: #e2808f;
  --pink-ink: #c4536a;
  --good: #35915f; --good-bg: #e3f3ea;
  --warn: #b97d12; --warn-bg: #fbf0d6;
  --bad: #cf4b47; --bad-bg: #fbe4e3;
  --cat-blue: #dceef0; --cat-pink: #fbe3e8; --cat-mint: #e0f2e6; --cat-butter: #fcf1d3; --cat-lavender: #ebe6f6; --cat-peach: #fde6d7;
  --radius: 14px; --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(47,74,77,.06), 0 10px 30px rgba(47,74,77,.12);
  --font: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --script: 'Sacramento', 'Brush Script MT', 'Snell Roundhand', cursive;
  --topbar: 64px;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 17px; font-weight: 800; }
h3 { font-size: 15px; font-weight: 800; }
p { margin: 0 0 10px; }
a { color: var(--blue-ink); }
small { font-size: 13px; }
:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
.muted { color: var(--muted); }
.num, .tabular { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; }

/* ---------- Ram ---------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: var(--topbar); padding: 6px 16px; padding-top: calc(6px + env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
.brand-cup { height: 42px; width: auto; }
.brand-word { height: 30px; width: auto; margin-top: 6px; }
.brand-app { font-family: var(--script); font-size: 30px; line-height: 1; color: var(--pink-ink); margin: 6px 0 0 2px; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 800; font-size: 15px; text-decoration: none; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab.is-active { background: var(--mist); color: var(--blue-ink); }
.tab-badge { position: absolute; top: -2px; right: -2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 2px var(--bg); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.pill.demo { background: var(--cat-pink); color: var(--pink-ink); }
main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

/* ---------- Knappar och fält ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--blue-ink); font-weight: 800; text-decoration: none; white-space: nowrap; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.btn.big { min-height: 56px; font-size: 18px; padding: 12px 26px; }
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.pink { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { border-color: var(--bad-bg); background: var(--bad-bg); color: var(--bad); }
.btn:disabled, .btn.is-disabled { opacity: .4; pointer-events: none; }
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 999px; border: 0; background: var(--mist); color: var(--muted); font-size: 22px; line-height: 1; }
.link-btn { border: 0; background: none; padding: 0; color: var(--blue-ink); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; }
.chip.is-active { border-color: var(--blue-deep); background: var(--blue-deep); color: #fff; }
.chip .count { font-weight: 700; opacity: .7; }
.input { min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; width: 100%; min-width: 0; }
.input:focus { outline: none; border-color: var(--blue-deep); box-shadow: 0 0 0 3px rgba(95,155,160,.2); }
.input.is-invalid { border-color: var(--bad); background: var(--bad-bg); }
.input:disabled { background: var(--mist); color: var(--muted); }
textarea.input { min-height: 80px; resize: vertical; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; }
input[type=date].input { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > span, .field > label, .lbl { font-size: 13px; font-weight: 800; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row.three { grid-template-columns: 1fr 1fr 1fr; }
.field-row.pc { grid-template-columns: 140px 1fr; }
.check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; }
.check input { width: 22px; height: 22px; flex: none; accent-color: var(--blue-deep); }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--mist); }
.seg-btn { min-height: 38px; padding: 4px 14px; border: 0; border-radius: 999px; background: transparent; font-weight: 800; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg-btn.is-active { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 3px rgba(47,74,77,.15); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.fine { font-size: 13px; color: var(--muted); }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; border-radius: var(--radius); background: var(--cat-butter); color: #6b5410; font-weight: 700; margin-bottom: 14px; }
.notice > span { flex: 1 1 260px; }
.notice.info { background: var(--cat-blue); color: var(--blue-ink); }
.notice.pink { background: var(--cat-pink); color: var(--pink-ink); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }

/* ---------- Sidor ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
.page-head h1 { font-size: 26px; font-weight: 800; margin-right: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-width: 0; overflow-wrap: anywhere; }
.page-head .sub { flex-basis: 100%; margin: -6px 0 0; color: var(--muted); font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; color: var(--muted); font-weight: 800; text-decoration: none; margin-bottom: 4px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.search-input { flex: 1 1 220px; max-width: 360px; min-height: 42px; border-radius: 999px; padding: 6px 16px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; min-width: 0; }
.card + .card { margin-top: 14px; }
.card > h2 { margin-bottom: 12px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.card-head h2 { margin-right: auto; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.two-col > div > .card + .card { margin-top: 14px; }
@media (max-width: 899px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.stack > * + * { margin-top: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { padding: 12px 16px; border-radius: var(--radius); background: var(--mist); border: 0; text-align: left; min-width: 0; }
button.stat { cursor: pointer; }
.stat-label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.stat-value { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.stat-sub { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.stat.open { background: var(--cat-blue); } .stat.open .stat-value { color: var(--blue-ink); }
.stat.late { background: var(--bad-bg); } .stat.late .stat-value, .stat.late .stat-label { color: var(--bad); }
.stat.late.is-zero { background: var(--mist); } .stat.late.is-zero .stat-value { color: var(--ink); } .stat.late.is-zero .stat-label { color: var(--muted); }
.stat.paid { background: var(--good-bg); } .stat.paid .stat-value { color: var(--good); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.table th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.table tbody tr[data-href] { cursor: pointer; }
.table tbody tr[data-href]:hover { background: var(--mist); }
.table tbody tr:last-child td { border-bottom: 0; }
.t-nr { font-weight: 800; color: var(--blue-ink); text-decoration: none; white-space: nowrap; }
.t-main { font-weight: 700; overflow-wrap: anywhere; }
.t-sub { display: block; font-size: 13px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.kv:last-child { border-bottom: 0; }
.kv b { white-space: nowrap; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); font-weight: 600; border: 1.5px dashed var(--line); border-radius: var(--radius-lg); }
.empty .btn { margin-top: 12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.end { justify-content: flex-end; }
.steps { margin: 0; padding-left: 22px; }
.steps li { margin-bottom: 8px; }
.howto { margin-top: 12px; }
.howto summary { cursor: pointer; font-weight: 800; color: var(--blue-ink); padding: 8px 0; }
.code { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, 'Courier New', monospace; font-size: 12px; line-height: 1.45; background: var(--mist); padding: 12px 14px; border-radius: 12px; margin: 10px 0 0; max-height: 320px; overflow: auto; }
.status-line { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--mist); font-weight: 700; font-size: 14px; margin-bottom: 12px; overflow-wrap: anywhere; }
.status-line.ok { background: var(--good-bg); color: var(--good); }
.status-line.warn { background: var(--warn-bg); color: var(--warn); }
.status-line.bad { background: var(--bad); color: #fff; font-size: 15px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.saved-flag { font-size: 13px; font-weight: 800; color: var(--good); opacity: 0; transition: opacity .3s; }
.saved-flag.is-on { opacity: 1; }

/* ---------- Statusmärken ---------- */
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; vertical-align: middle; }
.badge.big { font-size: 13px; padding: 5px 14px; }
.st-utkast { background: #eceff0; color: #5f6f71; }
.st-klar, .st-skickad { background: var(--cat-blue); color: var(--blue-ink); }
.st-forfallen { background: var(--bad-bg); color: var(--bad); }
.st-betald { background: var(--good-bg); color: var(--good); }
.st-krediterad { background: #f1f3f3; color: #8a9a9b; }
.badge.kredit { background: var(--cat-pink); color: var(--pink-ink); }
.badge.arkiv { background: #f1f3f3; color: #8a9a9b; }
.amount-neg { color: var(--pink-ink); }

/* ---------- Fakturalistan ---------- */
@media (max-width: 699px) {
  .inv-table thead, .cust-table thead { display: none; }
  .inv-table, .inv-table tbody, .cust-table, .cust-table tbody { display: block; }
  .inv-table tr, .cust-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .inv-table td, .cust-table td { padding: 0; border: 0; }
  .inv-table td.c-nr { grid-column: 1; grid-row: 1; }
  .inv-table td.c-status { grid-column: 2; grid-row: 1; text-align: right; }
  .inv-table td.c-kund { grid-column: 1 / -1; grid-row: 2; }
  .inv-table td.c-date { grid-column: 1; grid-row: 3; font-size: 13px; color: var(--muted); font-weight: 700; }
  .inv-table td.c-due { grid-column: 1; grid-row: 4; font-size: 13px; color: var(--muted); font-weight: 700; }
  .inv-table td.c-sum { grid-column: 2; grid-row: 3 / span 2; align-self: end; font-size: 18px; font-weight: 800; }
  .inv-table td.c-date::before { content: 'Fakturadatum '; }
  .inv-table td.c-due::before { content: 'Förfaller '; }
  .inv-table td.c-due:empty, .inv-table td.c-date:empty { display: none; }
  .cust-table td.c-name { grid-column: 1 / -1; }
  .cust-table td.c-ort, .cust-table td.c-kontakt { grid-column: 1; font-size: 14px; color: var(--muted); font-weight: 700; }
  .cust-table td.c-open { grid-column: 2; grid-row: 2; text-align: right; font-weight: 800; }
  .cust-table td.c-count { grid-column: 2; grid-row: 3; text-align: right; font-size: 13px; color: var(--muted); }
  .cust-table td.c-count::after { content: ' fakturor'; }
  .cust-table td:empty { display: none; }
  .table tbody tr[data-href]:hover { background: #fff; }
}

/* ---------- Fakturaredigering ---------- */
.editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; margin-bottom: 14px; }
@media (max-width: 899px) { .editor-grid { grid-template-columns: minmax(0, 1fr); } }
.cust-box { padding: 12px 14px; border-radius: var(--radius); background: var(--mist); overflow-wrap: anywhere; }
.cust-box b { font-size: 17px; }
.cust-box .btn-row { margin-top: 10px; }
.picker { position: relative; }
.picker-row { display: flex; gap: 8px; }
.picker-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; max-height: 320px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: #fff; border: 1.5px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); }
.picker-opt { display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; overflow-wrap: anywhere; }
.picker-opt small { display: block; color: var(--muted); font-weight: 600; }
.picker-opt.is-hl, .picker-opt:hover { background: var(--mist); }
.picker-opt.new { color: var(--blue-ink); font-weight: 800; }
.lines-card { margin-bottom: 14px; }
.lines-head, .ln { display: grid; grid-template-columns: minmax(0, 1fr) 84px 76px 124px 84px 116px 116px; gap: 8px; align-items: center; }
.lines-head { padding: 0 2px 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
.lines-head .r, .ln-amount { text-align: right; }
.ln { padding: 8px 2px; border-bottom: 1px solid var(--line); }
.ln .input { min-height: 44px; padding: 8px 10px; }
.ln .num.input { text-align: right; }
.ln-lbl { display: none; }
.ln-cell { min-width: 0; }
.ln-amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 4px; }
.ln-btns { display: flex; gap: 2px; justify-content: flex-end; }
.mini { width: 36px; height: 36px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 16px; font-weight: 800; line-height: 1; }
.mini:disabled { opacity: .3; }
.mini.del { color: var(--bad); }
.ln.is-text { grid-template-columns: minmax(0, 1fr) 116px; }
.ln.is-text .ln-name { font-style: italic; }
.ln-texttag { display: none; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.lines-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.lines-foot .hint { margin: 0 0 0 auto; }
.bottom-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 14px; align-items: start; }
@media (max-width: 899px) { .bottom-grid { grid-template-columns: minmax(0, 1fr); } }
.totals .kv { padding: 7px 0; }
.totals .kv.sub { color: var(--muted); font-weight: 700; font-size: 14px; }
.totals .kv.big { font-size: 20px; font-weight: 800; padding-top: 12px; border-top: 2px solid var(--ink); border-bottom: 0; }
.totals .kv.big b { font-size: 28px; color: var(--blue-ink); }
.totals .check { min-height: 36px; font-size: 14px; }
.lock-row { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.lock-row .btn { width: 100%; }
.credit-note { margin-bottom: 14px; }
.err-list { margin: 0 0 10px; padding-left: 20px; }
.err-list li { margin-bottom: 6px; }
.err-list.bad li::marker { color: var(--bad); }
.err-list.warn li::marker { color: var(--warn); }
@media (max-width: 1023px) {
  .lines-head { display: none; }
  .ln { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-areas: 'name name name name name name' 'qty qty unit unit price price' 'vat vat amt amt btns btns'; gap: 8px; padding: 12px 0; }
  .ln .c-name { grid-area: name; } .ln .c-qty { grid-area: qty; } .ln .c-unit { grid-area: unit; } .ln .c-price { grid-area: price; } .ln .c-vat { grid-area: vat; } .ln .ln-amount { grid-area: amt; align-self: end; padding-bottom: 10px; } .ln .ln-btns { grid-area: btns; align-self: end; }
  .ln-lbl { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 3px; }
  .ln-amount:not(:empty)::before { content: 'Belopp'; display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
  .ln.is-text { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'name name' 'tag btns'; }
  .ln.is-text .ln-texttag { display: block; grid-area: tag; }
}
/* På telefon får knapparna en egen rad så att beloppet inte hamnar under dem */
@media (max-width: 559px) {

// ---------- Dialoger ----------
function openModal({ title = '', body = '', footer = '', cls = '', dismissable = true, onClose } = {}) {
  const root = $('#modal-root'); const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" ${title ? `aria-label="${esc(title)}"` : ''}>
    ${title ? `<div class="modal-head"><h2>${esc(title)}</h2>${dismissable ? '<button class="icon-btn" data-close aria-label="Stäng">×</button>' : ''}</div>` : ''}
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
  root.appendChild(wrap);
  let closed = false;
  const close = (result) => { if (closed) return; closed = true; wrap.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(result); };
  // Esc stänger bara den översta dialogen.
  const onKey = (e) => { if (e.key === 'Escape' && dismissable && root.lastElementChild === wrap) { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', (e) => { if ((e.target === wrap && dismissable) || e.target.closest('[data-close]')) close(); });
  return { el: wrap, close };
}
function confirmDialog({ title, text, ok = 'OK', cancel = 'Avbryt', danger = false, html = false }) {

let driveBusy = false; let driveAgain = false; let driveTimer = null;
function driveConfigured() {

function driveUrlProblem() {

const scriptOutdated = () => { const p = ui.drivePing; return !!(p && p.ok && (Number(p.version || 0) < 3 || p.faktura === false)); };
function driveStatus() {
  const m = state.meta; const p = ui.drivePing;
  if (IN_PREVIEW) return { cls: 'warn', text: PREVIEW_MSG };
  if (DEMO) return { cls: 'warn', text: 'Demoläget skickar aldrig något till Google Drive.' };

  if (m.drivePending) return { cls: 'warn', text: `${last} Ändringar väntar på att skickas.${ver}` };

// Skickar backupen (och väntande faktura-PDF:er) till Drive. Fel i bakgrunden visas bara i statusraden.
async function driveUpload({ toastResult = false } = {}) {

  if (driveBusy) { driveAgain = true; return false; }
  if (navigator.onLine === false) { state.meta.drivePending = true; save(); updateDriveStatus(); if (toastResult) toast('Ingen uppkoppling. Kopian skickas när nätet är tillbaka.', 'bad'); return false; }
  clearTimeout(driveTimer); driveBusy = true; updateDriveStatus();
  try {
    const queue = (state.meta.drivePdfQueue || []).slice();
    let sent = false;
    for (const id of queue) {
      const inv = invById(id); let pdf = null;
      if (inv && isFinal(inv) && Pdf()) { try { pdf = await Pdf().render(inv, {}); } catch (e) { console.warn('PDF till Drive misslyckades', e); } }
      if (pdf) {
        const res = await S.uploadBackup(state, { pdf, pdfName: C.filename(inv) });

    if (toastResult) toast('Kunde inte kopiera till Drive: ' + state.meta.driveLastError, 'bad', { duration: 12000 });

// Direkt efter att en faktura skapats: backup med fakturans PDF, utan fördröjning.

    }

// ---------- Navigering ----------
function parseRoute() {

  const v = parts[0] || 'fakturor'; const id = parts[1] || null;
  if (v === 'faktura' && id) return { view: 'faktura', id };
  if (v === 'kund' && id) return { view: 'kund', id };
  if (['fakturor', 'kunder', 'installningar'].includes(v)) return { view: v, id: null };
  return { view: 'fakturor', id: null };
}
function go(hash, force = false) {

  location.hash = hash;
}
function onRoute() {
  flushSave();
  const prev = ui.view === 'faktura' ? ui.id : null;
  const r = parseRoute();
  if (prev && !(r.view === 'faktura' && r.id === prev)) { const old = invById(prev); if (isBlankDraft(old)) { state.invoices = state.invoices.filter((i) => i !== old); commit(); } }

function readCustForm(el) {

// Ny kund (eller ändra en befintlig) i en dialog. Ger kunden eller null.

    const m = openModal({ title: existing ? 'Ändra kund' : 'Ny kund', cls: 'wide', body: custFormHtml(c, 'data-cfd'),
      footer: `<button class="btn ghost" data-close>Avbryt</button><button class="btn primary" data-ok>Spara kund</button>`, onClose: (r) => resolve(r || null) });

        const nc = Object.assign(CUSTOMER_DEFAULTS(), o); state.customers.push(nc); commit(); m.close(nc);
      } else {

      }

    $('[data-ok]', el).addEventListener('click', submit);
    $$('input', el).forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }));
    setTimeout(() => { const f = $('[data-cfd=namn]', el); f.focus(); }, 50);

// ---------- Skapa (låsa) faktura ----------
async function lockInvoice(inv) {
  if (!inv || inv.status !== 'utkast') return;
  flushSave();
  const seller = C.sellerSnapshot(state.settings);
  if (inv.typ === 'faktura') { const c = custById(inv.customerId); if (c) inv.kund = C.customerSnapshot(c); }
  const res = C.validate(inv, seller);
  const t = C.totals(inv);
  const warnings = res.warnings.slice();
  if (t.vat !== 0 && String(seller.momsregnr || '').trim() && !state.settings.momsregBekraftad) warnings.unshift('Du har inte bekräftat momsregistreringsnumret under Inställningar.');
  if (res.errors.length) {
    const toSettings = res.errors.some((e) => /Inställningar/.test(e));
    const r = await alertDialog({ title: 'Fakturan kan inte skapas än', html: `<p class="modal-text">Rätta det här först:</p><ul class="err-list bad">${res.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>${warnings.length ? `<p class="fine">Att tänka på:</p><ul class="err-list warn">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}`,
      ok: 'Jag fixar det', extra: toSettings ? '<button class="btn" data-result="settings">Till Inställningar</button>' : '' });
    if (r === 'settings') go('#/installningar');
    return;
  }
  const nr = C.nextNumber(state); const credit = inv.typ === 'kredit';
  const ok = await confirmDialog({ title: `Skapa ${credit ? 'kreditfaktura' : 'faktura'} ${nr}`, html: true, ok: `Skapa ${credit ? 'kreditfaktura' : 'faktura'} ${nr}`,
    text: `<div class="pay-total"><span>${esc(inv.kund.namn)}</span><b>${C.kr(t.toPay)}</b></div>
      <p class="modal-text">${credit ? 'Kreditfakturan' : 'Fakturan'} får nummer <b>${nr}</b> och låses. Sedan går den inte att ändra. Upptäcker du ett fel efteråt rättar du det med en kreditfaktura.</p>
      ${warnings.length ? `<p class="fine" style="font-weight:800">Kontrollera innan du skapar:</p><ul class="err-list warn">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}` });
  if (!ok) return;
  if (inv.status !== 'utkast') return;
  const ts = nowIso();
  inv.lines = inv.lines.filter((l) => !C.isEmptyLine(l));
  inv.nr = C.nextNumber(state);
  inv.saljare = seller;
  inv.kund = Object.assign({}, inv.kund);
  inv.totals = C.totals(inv);
  inv.status = 'klar'; inv.finalizedAt = ts; inv.updated = ts;
  addHistory(inv, `${credit ? 'Kreditfaktura' : 'Faktura'} ${inv.nr} skapad`);
  learnItems(inv);
  if (credit && inv.krediterar) {
    const orig = invById(inv.krediterar.id);
    if (orig) { orig.status = 'krediterad'; orig.krediteradAv = { id: inv.id, nr: inv.nr }; orig.updated = ts; addHistory(orig, `Krediterad med kreditfaktura ${inv.nr}`); }
  }
  save(); backupAfterLock(inv); updateBanner();
  render(true);
  toast(`${credit ? 'Kreditfaktura' : 'Faktura'} ${inv.nr} är skapad. Ladda ner eller mejla den.`, 'ok', { duration: 6000 });
}
async function unlockInvoice(inv) {
  if (!canUnlock(inv)) return;
  if (!(await confirmDialog({ title: `Lås upp ${invTitle(inv).toLowerCase()}`, text: `Fakturan blir ett utkast igen och nummer ${inv.nr} släpps, så att nästa faktura du skapar får det. Gör bara så här om fakturan inte har skickats till kunden.`, ok: 'Lås upp', danger: true }))) return;
  const nr = inv.nr; const ts = nowIso();
  if (inv.typ === 'kredit' && inv.krediterar) {
    const orig = invById(inv.krediterar.id);
    if (orig && orig.krediteradAv && orig.krediteradAv.id === inv.id) { orig.krediteradAv = null; orig.status = orig.paidAt ? 'betald' : orig.sentAt ? 'skickad' : 'klar'; addHistory(orig, `Kreditfaktura ${nr} upplåst, krediteringen gäller inte längre`); }
  }
  Object.assign(inv, { status: 'utkast', nr: null, saljare: null, totals: null, finalizedAt: null, updated: ts });
  addHistory(inv, `Upplåst till utkast, nummer ${nr} släpptes`);
  state.meta.drivePdfQueue = (state.meta.drivePdfQueue || []).filter((x) => x !== inv.id);
  commit(); render(true); toast('Fakturan är ett utkast igen');
}

// ---------- Uppdatering ----------
async function checkForUpdate(btn) {
  if (IN_PREVIEW || DEMO || !('serviceWorker' in navigator)) { toast('Den här visningen har alltid senaste versionen.'); return; }
  if (navigator.onLine === false) { toast('Ingen internetanslutning. Sök igen när enheten är uppkopplad.', 'bad'); return; }
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) { flushSave(); location.reload(); return; }
  const reset = () => { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Sök efter uppdatering'; } };
  if (btn) { btn.disabled = true; btn.textContent = 'Söker…'; }
  let found = false; const onFound = () => { found = true; };
  reg.addEventListener('updatefound', onFound);
  try { await reg.update(); }
  catch (e) { reset(); toast('Kunde inte söka efter uppdatering. Kontrollera internetanslutningen.', 'bad'); return; }
  finally { reg.removeEventListener('updatefound', onFound); }
  if (found || reg.installing || reg.waiting) { flushSave(); toast('Ny version hittad. Appen startar om…', 'ok', { persist: true }); setTimeout(() => location.reload(), 4000); }
  else { reset(); toast(`Appen har senaste versionen, ${APP_VERSION}.`); }
}

  if (tr && !e.target.closest('a, button, input, select, textarea')) { location.hash = tr.dataset.href; return; }
  // Kundlistan stängs när man klickar utanför.
  if (!e.target.closest('#picker')) { const l = $('#pick-list'); if (l) l.classList.add('hidden'); }
});
document.addEventListener('focusin', (e) => { if (e.target.id === 'pick-input') updatePickList(true); });
document.addEventListener('input', (e) => {
  const el = e.target; const role = el.dataset.role;
  if (el.dataset.setting) { queueSetting(el); return; }
  if (el.dataset.lf) { onLineInput(el, e); return; }
  if (el.dataset.f) { onInvField(el); return; }
  if (el.dataset.cf) { onCustField(el); return; }
  if (el.id === 'pick-input') { ui.pickQuery = el.value; ui.pickHl = 0; updatePickList(true); return; }
  if (role === 'inv-search') { ui.search = el.value; const list = sortInvoices(state.invoices.filter((i) => matchFilter(i, ui.filter) && matchSearch(i, ui.search))); $('#inv-list').innerHTML = invListHtml(list); }
  else if (role === 'cust-search') { ui.custSearch = el.value; const q = lc(ui.custSearch); const list = state.customers.filter((c) => (ui.showArchived || !c.archived) && (!q || [c.namn, c.ort, c.kontakt, c.orgnr, c.epost].some((x) => lc(x).includes(q)))).sort((a, b) => String(a.namn).localeCompare(String(b.namn), 'sv')); $('#cust-list').innerHTML = custListHtml(list); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.setting) {
    const key = el.dataset.setting; const prev = pendingSettings.get(key); if (prev) { clearTimeout(prev.t); pendingSettings.delete(key); }
    saveSetting(key, el, el.type !== 'checkbox' && el.tagName !== 'SELECT');
    if (key === 'nastaNummer') { const box = $('#nasta-box'); if (box && !!box.querySelector('input:disabled') !== nastaLocked()) box.innerHTML = nastaHtml(); }
    if (key === 'orgnr' || key === 'momsregnr') { const sg = $('#onb-sugg'); if (sg) sg.innerHTML = onbSuggHtml(); }
    if (el.type === 'checkbox' || el.tagName === 'SELECT') toast('Sparat');
    return;
  }
  if (el.dataset.role === 'show-archived') { ui.showArchived = el.checked; render(); }
  if (el.dataset.lf === 'name') { const inv = curDraft(); const l = inv && lineById(inv, el.closest('[data-line]').dataset.line); if (l) { const it = itemByName(l.name); if (it && (l.price == null || l.price === '')) { applyItem(inv, l, it); updateTotalsUI(inv); queueSave(inv); } } }
});
// Kundsidan sparar direkt.
let custTimer = null;
function onCustField(el) {
  const c = custById(ui.id); if (!c) return;
  const k = el.dataset.cf; let v = el.value;
  if (k === 'villkor') { const n = C.parseNum(v); el.classList.toggle('is-invalid', v.trim() !== '' && (n == null || n < 0)); if (v.trim() !== '' && (n == null || n < 0)) return; v = v.trim() === '' ? null : Math.round(n); }
  if (k === 'epost') el.classList.toggle('is-invalid', !!v.trim() && !validEmail(v));
  c[k] = typeof v === 'string' && k !== 'anteckning' ? v.trim() : v; c.updated = nowIso();
  if (k === 'namn') { const t = $('#kund-title'); if (t) t.textContent = v || 'Ny kund'; }
  refreshDraftSnapshots(c);
  clearTimeout(custTimer); custTimer = setTimeout(() => { commit(); flashSaved(); }, 400);
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); flushSave(); clearTimeout(custTimer); commit(); toast('Sparat'); return; }
  const el = e.target;
  if (el.id === 'pick-input') {
    const list = $('#pick-list'); const opts = list ? $$('.picker-opt', list) : [];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (list.classList.contains('hidden')) { updatePickList(true); return; } ui.pickHl = (ui.pickHl + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length; updatePickList(true); }
    else if (e.key === 'Enter') { e.preventDefault(); const o = opts[ui.pickHl]; if (o) o.click(); }
    else if (e.key === 'Escape' && list && !list.classList.contains('hidden')) { e.stopPropagation(); list.classList.add('hidden'); }
    return;
  }
  if (e.key === 'Enter' && el.dataset && el.dataset.lf && el.tagName === 'INPUT') {
    if (el.dataset.lf === 'name' && e.isComposing) return;
    const inv = curDraft(); if (!inv) return; e.preventDefault();
    const row = el.closest('[data-line]'); const idx = inv.lines.findIndex((l) => l.id === row.dataset.line);
    // Enter går vidare till nästa fält i raden. Från priset till nästa rad, och på sista raden blir det en ny rad.
    const order = ['name', 'qty', 'unit', 'price']; const i = order.indexOf(el.dataset.lf);
    const nf = i >= 0 && i < order.length - 1 ? row.querySelector(`[data-lf="${order[i + 1]}"]`) : null;
    if (nf) { nf.focus(); if (nf.select) nf.select(); return; }
    const next = inv.lines.slice(idx + 1).find((l) => !isTextRow(l));
    if (next) $(`[data-line="${CSS.escape(next.id)}"] [data-lf=name]`).focus();
    else if (el.dataset.lf === 'price' || isTextRow(inv.lines[idx])) addLine(inv);
    return;
  }
  if (e.key === 'Enter' && el.dataset && el.dataset.setting && el.tagName === 'INPUT') el.blur();
  if (e.key === 'Enter' && el.tagName === 'TR' && el.dataset.href) location.hash = el.dataset.href;
});
window.addEventListener('hashchange', onRoute);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushSave(); if (custTimer) { clearTimeout(custTimer); custTimer = null; save(); } } });
window.addEventListener('pagehide', () => { flushSave(); if (custTimer) { clearTimeout(custTimer); custTimer = null; save(); } });
function updateOnline() { $('#offline').classList.toggle('hidden', navigator.onLine !== false); }
window.addEventListener('online', updateOnline); window.addEventListener('offline', updateOnline);
window.addEventListener('online', () => { if (state.meta.drivePending && driveConfigured() && state.settings.driveAuto) setTimeout(() => driveUpload().catch(() => {}), 2000); });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; if (ui.view === 'installningar') render(); });
window.addEventListener('faktura:update', () => {
  const active = document.activeElement && document.activeElement.tagName;
  const busy = document.querySelector('.modal-wrap') || ['INPUT', 'TEXTAREA', 'SELECT'].includes(active);
  if (!busy) { flushSave(); location.reload(); return; }
  toast('En ny version av appen finns.', 'ok', { action: 'Ladda om', onAction: () => { flushSave(); location.reload(); }, persist: true });
});
// Låter tabellrader nås med tangentbordet.
new MutationObserver(() => $$('tr[data-href]:not([tabindex])').forEach((tr) => tr.setAttribute('tabindex', '0'))).observe($('#view'), { childList: true, subtree: true });

// ---------- Start ----------
async function boot() {
  if (DEMO) {
    $('#demo-pill').classList.remove('hidden');
    try {
      if (!window.FakturaFixture) await loadScript('tests/fixture.js');
      const fx = window.FakturaFixture();
      state = migrate(fx.state); state.meta.onboarded = true;
      state.invoices.filter(isFinal).sort((a, b) => a.nr - b.nr).forEach(learnItems);
    } catch (e) { console.error(e); toast('Kunde inte ladda demodatan. Visar en tom app.', 'bad'); state = seedState(); state.meta.onboarded = true; }
  }
  if (!DEMO && navigator.storage && navigator.storage.persist) navigator.storage.persist().then((p) => { ui.persisted = p; const el = $('#persist-state'); if (el) el.textContent = p ? 'ja' : 'nej'; }).catch(() => {});
  // Tomma utkast som blivit kvar städas bort.
  const r = parseRoute();
  const before = state.invoices.length;
  state.invoices = state.invoices.filter((i) => !isBlankDraft(i) || (r.view === 'faktura' && r.id === i.id));
  if (state.invoices.length !== before) save();
  if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/fakturor');
  ui.view = r.view; ui.id = r.id;
  updateOnline(); render(true);
  if (!window.FakturaPdf || !window.FakturaSync) console.warn('Saknade delar:', { pdf: !!window.FakturaPdf, sync: !!window.FakturaSync, import: !!window.FakturaImport });
  if (state.meta.drivePending && driveConfigured() && state.settings.driveAuto) setTimeout(() => driveUpload().catch(() => {}), 6000);
}
boot();
})();
